# GEDI Check — CI Pipeline
# AI behaviour guardrail: lint, test, GitHub mirror

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  - group: EasyWay-Secrets

stages:
  - stage: BuildAndTest
    displayName: 'Build, Lint & Test'
    jobs:
      - job: PythonTest
        displayName: 'Python Lint & Test'
        steps:
          - checkout: self

          - script: |
              set -e
              python3 --version
              python3 -m venv .venv
              source .venv/bin/activate
              pip install --upgrade pip
              pip install -e .
              pip install pytest ruff
            displayName: 'Install dependencies'

          - script: |
              set -e
              source .venv/bin/activate
              ruff check src/ tests/
            displayName: 'Lint (Ruff)'
            continueOnError: true

          - script: |
              set -e
              source .venv/bin/activate
              python -m pytest tests/ -v --tb=short
            displayName: 'Test (pytest)'

  - stage: GitHubMirror
    displayName: 'GitHub Mirror (publish main → github)'
    dependsOn: BuildAndTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: MirrorToGitHub
        displayName: 'Mirror to GitHub (SSoT: factory-vcs.json)'
        pool:
          name: Default
        steps:
          - checkout: self
            fetchDepth: 0
          - script: bash /opt/easyway/scripts/ci/mirror-github.sh easyway-gedi-check
            displayName: 'Mirror to GitHub'
            continueOnError: true
